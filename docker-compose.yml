services:
  db:
    image: pgvector/pgvector:pg18
    container_name: document-analyzer-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: document_analyzer
    ports:
      - "5433:5432"
    volumes:
      - document-analyzer-db-data:/var/lib/postgresql
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: document-analyzer-redis
    ports:
      - "6379:6379"
    volumes:
      - document-analyzer-redis-data:/data
    restart: unless-stopped

volumes:
  document-analyzer-db-data:
  document-analyzer-redis-data:
