<main class="landing">
  <h1>AI Document Intelligence</h1>
  <p>Platform for analyzing and understanding documents using LLMs.</p>

  <section class="health" aria-label="System status">
    <h2>System status</h2>

    @if (error()) {
      <p class="error">Backend unreachable: {{ error() }}</p>
    } @else if (health()) {
      <ul>
        <li>Status: <strong>{{ health()!.status }}</strong></li>
        <li>Database: <strong>{{ health()!.db }}</strong></li>
      </ul>
    } @else {
      <p>Checking...</p>
    }

    <button (click)="checkHealth()">Re-check</button>
  </section>
</main>
